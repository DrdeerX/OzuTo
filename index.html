document.addEventListener('click', async e => {
  const a = e.target.closest('[data-action]');
  // task cards open the detail panel (unless a long-press just fired)
  const card = e.target.closest('.task-card');
  if(card && !a){ if(pressFired){ pressFired = false; return; } openTaskDetail(card.dataset.task); return; }
  if(!a) return;
  const act = a.dataset.action;
  switch(act){
    case 'signin': return doSignIn();
    case 'signup': return doSignUp();
    case 'show-signup': $('si-error').textContent=''; return showAuthBox('signup');
    case 'profile': return openProfile();
    case 'search': return openSearch();
    case 'ics': { const o = findOcc(a.dataset.occ); if(o) downloadIcs(o); return; }
    case 'home-mine': Object.assign(state.taskFilter, { mine:true, open:false, team:'', tag:'', q:'' }); return setView('tasks');
    case 'home-open': Object.assign(state.taskFilter, { mine:false, open:true, team:'', tag:'', q:'' }); return setView('tasks');
    case 'home-team': Object.assign(state.taskFilter, { mine:false, open:false, team:a.dataset.team, tag:'', q:'' }); return setView('tasks');
    case 'home-note': state.openNoteId = a.dataset.id; state.noteEdit = null; return setView('notes');
    case 'show-forgot': return showForgot();
    case 'forgot': return doForgot();
    case 'reset-approve': return resolveReset(a.dataset.id, true);
    case 'reset-reject': return resolveReset(a.dataset.id, false);
    case 'show-signin': $('su-error').textContent=''; $('fp-error').textContent=''; return showAuthBox('signin');
    case 'check-status': return route();
    case 'signout': return doSignOut();
    case 'lang': return setLang(a.dataset.lang);
    case 'theme': return toggleTheme();
    case 'toggle-nav': return document.body.classList.toggle('nav-open');
    case 'nav': return setView(a.dataset.view);
    case 'close-modal': return closeModal(modalStack.find(m => m.el.contains(a))?.el);
    // schedule
    case 'cal-prev': return calMove(-1);
    case 'cal-next': return calMove(1);
    case 'cal-today': state.calCursor = todayKey(); return renderSchedule();
    case 'cal-view': state.calView = a.dataset.v; return renderSchedule();
    case 'new-event': return openEventForm({ day: state.calView==='month' && keyParts(state.calCursor).m0 !== keyParts(todayKey()).m0 ? state.calCursor : todayKey() });
    case 'new-event-day': closeModal(); return openEventForm({ day: a.dataset.day });
    case 'day-click': return openEventForm({ day: a.dataset.day });
    case 'day-more': e.stopPropagation(); return openDayList(a.dataset.day);
    case 'week-slot': {
      const r = a.getBoundingClientRect();
      const hour = Math.max(0, Math.min(23, Math.floor((e.clientY - r.top) / 44)));
      return openEventForm({ day: a.dataset.day, hour });
    }
    case 'open-occ': e.stopPropagation(); return openEventDetail(a.dataset.occ);
    case 'edit-occ': { const o = findOcc(a.dataset.occ); if(o) openEventForm({ occ: o }); return; }
    case 'delete-occ': return deleteOccurrence(a.dataset.occ);
    case 'task-for-occ': {
      const o = findOcc(a.dataset.occ); if(!o) return;
      return openTaskForm(null, { eventValue: o.event.id + '|' + (o.event.rrule ? o.originalDate : ''), due: istKey(o.start) });
    }
    // tasks
    case 'task-view': state.taskView = a.dataset.v; return renderTasks();
    case 'tf-toggle': state.taskFilter[a.dataset.f] = !state.taskFilter[a.dataset.f]; return renderTasks();
    case 'task-sort': { const s = state.taskSort; if(s.key === a.dataset.k) s.dir *= -1; else { s.key = a.dataset.k; s.dir = 1; } return renderTasks(); }
    case 'new-task': return openTaskForm(null);
    case 'open-task': return openTaskDetail(a.dataset.id);
    case 'edit-task': { const tk = state.tasks.find(x => x.id === a.dataset.id); if(tk) openTaskForm(tk); return; }
    case 'delete-task': {
      if(!await confirmDialog(t('confirmDeleteTask'))) return;
      try{ await api.remove('tasks', { id: a.dataset.id }); closeModalsOfKind('task'); toast(t('deleted')); await reload('tasks','task_claims'); }catch(err){ showError(err); }
      return;
    }
    case 'claim':
      try{ await api.insert('task_claims', { task_id: a.dataset.id, user_id: state.uid }); }catch(err){ showError(err); }
      return reload('task_claims');
    case 'unclaim':
      try{ await api.remove('task_claims', { task_id: a.dataset.id, user_id: state.uid }); }catch(err){ showError(err); }
      return reload('task_claims');
    case 'unclaim-user':
      try{ await api.remove('task_claims', { task_id: a.dataset.task, user_id: a.dataset.user }); }catch(err){ showError(err); }
      return reload('task_claims');
    case 'send-comment': {
      const box = $('cm-body'); const body = box.value.trim();
      if(!body) return;
      a.disabled = true;
      try{ await api.insert('task_comments', { id: uuid(), task_id: a.dataset.id, user_id: state.uid, body }); box.value = ''; await loadComments(a.dataset.id); }
      catch(err){ showError(err); a.disabled = false; }
      return;
    }
    case 'delete-comment': {
      if(!await confirmDialog(t('confirmDeleteComment'))) return;
      try{ await api.remove('task_comments', { id: a.dataset.id }); if(state.openTaskId) await loadComments(state.openTaskId); }catch(err){ showError(err); }
      return;
    }
    case 'task-goto-event': {
      e.preventDefault();
      const tk = state.tasks.find(x => x.id === a.dataset.id); if(!tk || !tk.event_id) return;
      const ev = state.events.find(x => x.id === tk.event_id); if(!ev) return;
      const day = tk.event_date || istKey(ev.start_at);
      closeAllModals();
      state.calCursor = day; setView('schedule');
      openEventDetail(ev.id + '|' + day);
      return;
    }
    case 'add-person': {
      const sel = $('td-add-person'); if(!sel || !sel.value) return;
      try{ await api.insert('task_claims', { task_id: a.dataset.id, user_id: sel.value }); }catch(err){ showError(err); }
      return reload('task_claims');
    }
    case 'tag-filter':
      e.stopPropagation();
      state.taskFilter.tag = a.dataset.id; closeAllModals();
      if(state.view !== 'tasks') return setView('tasks');
      return renderTasks();
    case 'manage-tags': return openTagManager();
    case 'tag-add': return addTag();
    case 'tag-color': {
      const tg = state.tags.find(x => x.id === a.dataset.id); if(!tg) return;
      const keys = Object.keys(COLORS), next = keys[(keys.indexOf(tg.color) + 1) % keys.length];
      try{ await api.update('tags', { id: tg.id }, { color: next }); }catch(err){ showError(err); }
      return reload('tags');
    }
    case 'tag-delete': {
      const tg = state.tags.find(x => x.id === a.dataset.id); if(!tg) return;
      const n = state.task_tags.filter(x => x.tag_id === tg.id).length;
      if(!await confirmDialog(t('confirmDeleteTag', { name: tg.name, n }))) return;
      try{ await api.remove('tags', { id: tg.id }); }catch(err){ showError(err); }
      return reload('tags', 'task_tags');
    }
    // notes
    case 'new-note': {
      if(!await leaveNoteEditor()) return;
      const id = uuid();
      try{ await api.insert('notes', { id, title: '', body: '', visibility: 'private', readers_can_edit: false, author_id: state.uid }); }
      catch(err){ return showError(err); }
      for(const tb of NOTE_TABLES) state[tb] = await api.list(tb);
      state.openNoteId = id; state.noteSettings = false;
      const n = state.notes.find(x => x.id === id);
      return n ? startNoteEdit(n) : renderNotes(true);
    }
    case 'open-note':
      if(a.dataset.id === state.openNoteId) return;
      if(!await leaveNoteEditor()) return;
      state.openNoteId = a.dataset.id; state.noteSettings = false;
      return renderNotes(true);
    case 'close-note':
      if(!await leaveNoteEditor()) return;
      state.openNoteId = null; return renderNotes(true);
    case 'note-filter': state.noteFilter = a.dataset.f; return renderNotes(true);
    case 'note-edit': { const n = state.notes.find(x => x.id === state.openNoteId); if(n && !state.noteEdit) startNoteEdit(n); return; }
    case 'note-view': if(await leaveNoteEditor()) renderNotes(true); return;
    case 'note-save': return saveNote();
    case 'note-reload': state.noteEdit = null; return reloadNotes();
    case 'note-settings': state.noteSettings = !state.noteSettings; return renderNotes(true);
    case 'note-vis': return updateNoteSettings(a.dataset.v === 'private' ? { visibility: 'private', readers_can_edit: false } : { visibility: a.dataset.v });
    case 'note-shares-save': {
      const id = state.openNoteId, want = pickedIds($('view-notes'), 'ns-people'), have = sharesOf(id);
      try{
        for(const u of want.filter(x => !have.includes(x))) await api.insert('note_shares', { note_id: id, user_id: u });
        for(const u of have.filter(x => !want.includes(x))) await api.remove('note_shares', { note_id: id, user_id: u });
        toast(t('saved'));
      }catch(err){ showError(err); }
      return reloadNotes();
    }
    case 'note-hide': {
      const id = a.dataset.id, hidden = hiddenNoteIds().has(id);
      if(!hidden && !await leaveNoteEditor()) return;
      try{
        if(hidden) await api.remove('note_hidden', { note_id: id, user_id: state.uid });
        else await api.insert('note_hidden', { note_id: id, user_id: state.uid });
      }catch(err){ return showError(err); }
      if(!hidden && state.noteFilter !== 'hidden') state.openNoteId = null;
      return reloadNotes();
    }
    case 'note-check': return toggleNoteCheck(Number(a.dataset.line));
    case 'note-delete': {
      if(!await confirmDialog(t('confirmDeleteNote'))) return;
      try{ await api.remove('notes', { id: a.dataset.id }); }catch(err){ return showError(err); }
      state.openNoteId = null; state.noteEdit = null; toast(t('deleted'));
      return reloadNotes();
    }
    // teams
    case 'team-add': {
      const sel = document.querySelector(`[data-team-add="${a.dataset.team}"]`);
      if(sel && sel.value) await setTeam(sel.value, a.dataset.team);
      return;
    }
    case 'team-remove': {
      const p = state.profiles.find(x => x.id === a.dataset.id);
      if(!p || !await confirmDialog(t('confirmRemoveTeam', { name: profileName(p.id) }), t('removeFromTeam'))) return;
      return setTeam(p.id, null);
    }
    case 'team-task': return openTaskForm(null, { team: a.dataset.team });
    // members
    case 'm-role': return setRole(a.dataset.id, a.dataset.role);
    case 'm-reject': {
      const p = state.profiles.find(x => x.id === a.dataset.id);
      if(!await confirmDialog(t('confirmReject', { name: p ? p.username : '' }), t('reject'))) return;
      try{ await api.remove('profiles', { id: a.dataset.id }); await reload('profiles'); }catch(err){ showError(err); }
      return;
    }
    case 'm-remove': {
      const p = state.profiles.find(x => x.id === a.dataset.id);
      if(!await confirmDialog(t('confirmRemove', { name: p ? p.username : '' }), t('removeMember'))) return;
      return setRole(a.dataset.id, 'pending');
    }
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && modalStack.length){ closeModal(); return; }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); return; }
  if(e.key === '/' && !modalStack.length && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !e.target.isContentEditable){ e.preventDefault(); openSearch(); return; }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && state.noteEdit && $('ne-body')){ e.preventDefault(); saveNote(); return; }
  if(e.key !== 'Enter') return;
  const id = e.target.id;
  if(id === 'si-user' || id === 'si-pass') doSignIn();
  if(id === 'su-user' || id === 'su-pass' || id === 'su-pass2') doSignUp();
});

/* =====================================================================
   Theme
   ===================================================================== */
function applyTheme(th){
  if(th) document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme');
  const dark = th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#121a2c' : '#f3ece0');
}
function toggleTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('otc-theme', next); }catch(e){}
}
try{ applyTheme(localStorage.getItem('otc-theme')); }catch(e){}

/* =====================================================================
   Recurrence self-test (open with ?selftest)
   ===================================================================== */
function runSelfTest(){
  const cases = [
    ['daily every 2, count 4', '2026-10-01', { freq:'daily', interval:2, end:{type:'count',count:4} }, '2026-12-31', ['2026-10-01','2026-10-03','2026-10-05','2026-10-07']],
    ['weekly Mon+Wed', '2026-10-05', { freq:'weekly', interval:1, byweekday:[0,2], end:{type:'until',date:'2026-10-14'} }, '2026-12-31', ['2026-10-05','2026-10-07','2026-10-12','2026-10-14']],
    ['weekly every 2 weeks, start on Wed with Mon+Wed', '2026-10-07', { freq:'weekly', interval:2, byweekday:[0,2], end:{type:'count',count:3} }, '2026-12-31', ['2026-10-07','2026-10-19','2026-10-21']],
    ['monthly day 31 skips short months', '2026-01-31', { freq:'monthly', interval:1, monthlyMode:'day', end:{type:'count',count:3} }, '2026-12-31', ['2026-01-31','2026-03-31','2026-05-31']],
    ['monthly first Monday', '2026-10-05', { freq:'monthly', interval:1, monthlyMode:'nth', nth:1, end:{type:'count',count:3} }, '2027-12-31', ['2026-10-05','2026-11-02','2026-12-07']],
    ['monthly last Friday', '2026-10-30', { freq:'monthly', interval:1, monthlyMode:'nth', nth:-1, end:{type:'count',count:3} }, '2027-12-31', ['2026-10-30','2026-11-27','2026-12-25']],
    ['yearly Feb 29', '2024-02-29', { freq:'yearly', interval:1, end:{type:'never'} }, '2032-12-31', ['2024-02-29','2028-02-29','2032-02-29']],
    ['max key cuts never-ending rule', '2026-10-01', { freq:'weekly', interval:1, end:{type:'never'} }, '2026-10-20', ['2026-10-01','2026-10-08','2026-10-15']],
    ['one-time', '2026-10-01', null, '2026-12-31', ['2026-10-01']],
  ];
  let ok = true;
  for(const [name, start, rule, max, want] of cases){
    const got = ruleDates(start, rule, max);
    const pass = JSON.stringify(got) === JSON.stringify(want);
    ok = ok && pass;
    console[pass ? 'log' : 'error'](`${pass ? 'PASS' : 'FAIL'} ${name}`, pass ? '' : { got, want });
  }
  // exceptions: cancelled date removed, override moves time
  const ev = { id:'e', title:'T', start_at: istToIso('2026-10-05',18,0), end_at: istToIso('2026-10-05',19,0), rrule:{ freq:'weekly', interval:1, byweekday:[0], end:{type:'never'} } };
  const occ = expandEvent(ev, [{ event_id:'e', original_date:'2026-10-12', cancelled:true }, { event_id:'e', original_date:'2026-10-19', cancelled:false, title:'Moved', start_at: istToIso('2026-10-20',10,0), end_at: istToIso('2026-10-20',11,0) }],
    istToIso('2026-10-01',0,0), istToIso('2026-10-31',0,0));
  const pass2 = occ.map(o => o.originalDate).join() === '2026-10-05,2026-10-19,2026-10-26' && occ[1].title === 'Moved' && hhmm(occ[1].start) === '10:00' && istKey(occ[1].start) === '2026-10-20';
  ok = ok && pass2;
  console[pass2 ? 'log' : 'error'](`${pass2 ? 'PASS' : 'FAIL'} exceptions`);
  console.log(ok ? 'SELFTEST OK' : 'SELFTEST FAILED');
  toast(t(ok ? 'selfTestPass' : 'selfTestFail'), !ok);
  return ok;
}

  if(new URLSearchParams(location.search).has('selftest')) runSelfTest();
  if(!api){ showAuthBox('setup'); return; }

})();
