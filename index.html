<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ÖzüTo">
<title>ÖzüTo</title>
<meta name="theme-color" content="#f3ece0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Passport / travel-poster theme. Light = paper, dark = "night flight". */
  :root{
    --bg:#f3ece0; --bg-elev:#fbf6ec; --bg-soft:#ebe2d2; --text:#1f2a44; --text-dim:#5a6178;
    --border:#d6c9b2; --rule:#1f2a44; --accent:#b4532a; --accent-dim:#f2dccd; --accent-contrast:#fffaf1;
    --ink:#1f2a44; --on-ink:#f3ece0;
    --danger:#a8322a; --danger-dim:#f5ddd8; --success:#2f6b4f; --success-dim:#dcebdf;
    --warn:#8a5d0f; --warn-dim:#f4e6c6;
    --radius:4px; --radius-sm:3px;
    --font-display:"Fraunces", Georgia, "Times New Roman", serif;
    --font-body:"Instrument Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#121a2c; --bg-elev:#18223a; --bg-soft:#1f2b47; --text:#efe6d4; --text-dim:#a2a8b8;
    --border:#2e3a58; --rule:#5b6888; --accent:#e2804f; --accent-dim:#3b2a26; --accent-contrast:#121a2c;
    --ink:#efe6d4; --on-ink:#121a2c;
    --danger:#f08a7e; --danger-dim:#3d2228; --success:#7fc59c; --success-dim:#1b3329;
    --warn:#e8bd62; --warn-dim:#3a2f18;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121a2c; --bg-elev:#18223a; --bg-soft:#1f2b47; --text:#efe6d4; --text-dim:#a2a8b8;
      --border:#2e3a58; --rule:#5b6888; --accent:#e2804f; --accent-dim:#3b2a26; --accent-contrast:#121a2c;
      --ink:#efe6d4; --on-ink:#121a2c;
      --danger:#f08a7e; --danger-dim:#3d2228; --success:#7fc59c; --success-dim:#1b3329;
      --warn:#e8bd62; --warn-dim:#3a2f18;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  .fp-done{ border:1px dashed var(--accent); padding:12px 14px; color:var(--text); }
  .fp-code{ font-family:var(--font-mono); font-size:26px; letter-spacing:.18em; text-align:center; color:var(--accent); user-select:all; }
  .reset-hint{ font-size:12.5px; color:var(--text-dim); margin:4px 0 8px; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  button, a, select, input, textarea, label{ touch-action:manipulation; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  [hidden]{ display:none !important; }
  button, input, select, textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }
  svg.icon{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; vertical-align:-2px; }
  .mono{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }

  /* Club stamp mark */
  .logo-mark{ width:46px; height:46px; border-radius:8px; object-fit:cover; flex-shrink:0; display:block; }
  .lock-box .logo-mark{ width:56px; height:56px; }
  .stamp-mark{ width:34px; height:34px; border:1.5px solid var(--accent); border-radius:50%; color:var(--accent); display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; font-weight:500; letter-spacing:.04em; transform:rotate(-8deg); flex-shrink:0; }

  /* Auth screens: a boarding pass */
  #auth-screen{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; }
  .lock-box{ width:min(360px,100%); background:var(--bg-elev); border:1.5px dashed var(--rule); border-radius:var(--radius); padding:26px 24px 22px; text-align:left; }
  .lock-box .brand-mark{ display:flex; align-items:center; gap:10px; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--rule); }
  .lock-box .brand-mark .name{ font-family:var(--font-display); font-size:22px; line-height:1.1; }
  .lock-box .brand-mark .sub{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
  .lock-box h1{ font-family:var(--font-display); font-size:26px; font-weight:500; margin:0 0 4px; }
  .lock-box p{ font-size:13px; color:var(--text-dim); margin:0 0 18px; }
  .lock-box input{ width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; margin-bottom:10px; }
  .lock-box input:focus{ outline:none; border-color:var(--rule); }
  .lock-btn{ width:100%; padding:11px 12px; border-radius:var(--radius-sm); border:none; background:var(--ink); color:var(--on-ink); font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:500; }
  .lock-btn:hover{ background:var(--accent); color:var(--accent-contrast); }
  .lock-btn:disabled{ opacity:.6; cursor:default; }
  .lock-btn.secondary{ background:transparent; color:var(--text); border:1px solid var(--border); margin-top:8px; }
  .lock-error{ color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px; }
  .lock-switch{ font-size:13px; color:var(--text-dim); margin-top:12px; }
  .lock-switch a{ color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .lang-switch{ display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; margin-top:18px; }
  .lang-switch button{ border:none; background:transparent; padding:4px 11px; font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--text-dim); }
  .lang-switch button.active{ background:var(--ink); color:var(--on-ink); }
  .wait-icon{ width:52px; height:52px; border-radius:50%; border:1.5px solid var(--accent); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 0 14px; transform:rotate(-8deg); }
  .wait-icon svg{ width:22px; height:22px; }

  /* App shell */
  #app{ display:flex; min-height:100vh; }
  .sidebar{ width:232px; flex-shrink:0; background:var(--bg); color:var(--text); display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; border-right:1px solid var(--rule); }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px 18px; margin-bottom:12px; border-bottom:1px solid var(--border); }
  .brand .name{ font-family:var(--font-display); font-size:22px; line-height:1.1; }
  .brand .sub{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
  .nav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 8px; border-radius:var(--radius-sm); background:transparent; border:none; border-left:2px solid transparent; color:var(--text-dim); font-size:14px; margin-bottom:2px; }
  .nav-item:hover{ color:var(--text); background:var(--bg-soft); }
  .nav-item.active{ color:var(--text); border-left-color:var(--accent); border-radius:0; background:var(--bg-soft); font-weight:500; }
  .nav-item.active svg{ stroke:var(--accent); }
  .nav-badge{ margin-left:auto; background:var(--accent); color:var(--accent-contrast); font-family:var(--font-mono); font-size:10.5px; border-radius:var(--radius-sm); padding:0 6px; }
  .sidebar-spacer{ flex:1; }
  .sidebar-footer{ padding-top:12px; border-top:1px solid var(--border); }
  .side-user{ display:flex; align-items:center; gap:9px; padding:6px 6px 10px; font-size:13.5px; width:100%; text-align:left; background:none; border:none; color:inherit; border-radius:var(--radius-sm); cursor:pointer; }
  .side-user:hover{ background:var(--bg-soft); }
  .profile-head{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .profile-head .avatar{ width:52px; height:52px; font-size:20px; }
  .profile-head .pname{ font-family:var(--font-display); font-size:22px; line-height:1.15; }
  .profile-facts{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; margin-bottom:6px; }
  .profile-facts dt{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); padding-top:2px; }
  .profile-facts dd{ margin:0; }
  .profile-msg{ font-size:12.5px; min-height:18px; margin-top:6px; }
  .profile-msg.err{ color:var(--danger); }
  .side-user .role{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }
  .side-btn{ display:flex; align-items:center; gap:8px; width:100%; padding:7px 8px; border-radius:var(--radius-sm); background:transparent; border:none; color:var(--text-dim); font-size:13px; text-align:left; }
  .side-btn:hover{ background:var(--bg-soft); color:var(--text); }
  .sidebar .lang-switch{ margin:4px 6px 6px; }
  .offline-badge{ margin:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--warn); }
  .topbar{ display:none; }
  .nav-search{ display:flex; align-items:center; gap:8px; width:100%; padding:7px 9px; margin:0 0 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text-dim); font-size:13.5px; text-align:left; cursor:text; }
  .nav-search span{ flex:1; }
  .nav-search kbd{ font-family:var(--font-mono); font-size:10px; border:1px solid var(--border); border-radius:3px; padding:0 4px; }
  .nav-search:hover{ border-color:var(--rule); }
  .search-box{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--rule); padding-bottom:10px; margin-bottom:6px; }
  .search-box input{ flex:1; border:none; background:transparent; font-size:18px; color:var(--text); padding:6px 2px; }
  .search-box input:focus{ outline:none; }
  .sr-group{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin:14px 0 4px; }
  .sr-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 6px; background:none; border:none; border-bottom:1px dashed var(--border); border-radius:var(--radius-sm); color:var(--text); }
  .sr-item:hover, .sr-item.sel{ background:var(--bg-soft); }
  .sr-item .icon{ flex-shrink:0; color:var(--text-dim); }
  .sr-main{ flex:1; min-width:0; }
  .sr-main b{ display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sr-main span{ display:block; font-size:12px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sr-results mark{ background:transparent; color:var(--accent); font-weight:600; }
  .sr-hint{ color:var(--text-dim); font-size:13px; padding:14px 2px; }
  .scrim{ display:none; }

  .main{ flex:1; min-width:0; padding:30px 38px 64px; max-width:1240px; }
  .view{ display:none; }
  .view.active{ display:block; }
  h1{ font-family:var(--font-display); font-size:34px; font-weight:500; line-height:1.05; letter-spacing:-.01em; margin:0; }
  .muted{ color:var(--text-dim); }
  .small{ font-size:12.5px; }
  .page-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .page-header.rule{ border-bottom:1px solid var(--rule); padding-bottom:14px; margin-bottom:16px; }
  .kicker{ display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .btn{ display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:var(--radius-sm); border:1px solid var(--border); background:transparent; color:var(--text); font-size:13.5px; font-weight:500; white-space:nowrap; transition:border-color .12s, background .12s, color .12s; }
  .btn:hover{ border-color:var(--rule); }
  .btn-primary{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
  .btn-primary:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn-danger{ color:var(--danger); }
  .btn-danger:hover{ border-color:var(--danger); }
  .btn-sm{ padding:4px 9px; font-size:12.5px; }
  .btn-icon{ padding:7px; }
  .btn:disabled, .btn:disabled:hover{ opacity:.45; cursor:not-allowed; background:transparent; color:var(--text); border-color:var(--border); }
  .seg{ display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
  .seg button{ border:none; background:transparent; padding:6px 12px; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }
  .seg button + button{ border-left:1px solid var(--border); }
  .seg button.active{ background:var(--ink); color:var(--on-ink); }

  .card{ background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-dim); font-family:var(--font-display); font-style:italic; font-size:16px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:var(--radius-sm); border:1px solid var(--border); background:transparent; font-size:12.5px; color:var(--text-dim); }
  .chip:hover{ border-color:var(--rule); color:var(--text); }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
  select.chip{ padding:4px 8px; background:var(--bg); }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:10.5px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; padding:1px 6px; border-radius:var(--radius-sm); border:1px solid var(--border); color:var(--text-dim); white-space:nowrap; }
  .badge.p-high{ color:var(--danger); border-color:currentColor; }
  .badge.p-medium{ color:var(--warn); border-color:currentColor; }
  .badge.p-low{ color:var(--success); border-color:currentColor; }
  .badge.accent{ color:var(--accent); border-color:currentColor; }
  .badge.full{ color:var(--accent); border:1.5px solid var(--accent); transform:rotate(-5deg); padding:1px 7px; }
  .avatar{ width:24px; height:24px; border-radius:50%; background:var(--bg-soft); color:var(--text); font-family:var(--font-mono); font-size:10px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; border:1.5px solid var(--bg-elev); box-shadow:0 0 0 1px var(--border); }
  .avatars{ display:inline-flex; }
  .avatars .avatar + .avatar{ margin-left:-6px; }

  /* Schedule: month */
  .cal-title{ font-family:var(--font-display); font-size:22px; font-weight:500; min-width:150px; text-transform:capitalize; }
  .month-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--rule); border-left:1px solid var(--border); background:var(--bg-elev); }
  .month-head{ padding:7px 8px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); border-right:1px solid var(--border); border-bottom:1px solid var(--rule); }
  .month-cell{ min-height:110px; padding:5px 6px 6px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); cursor:pointer; overflow:hidden; }
  .month-cell:hover{ background:var(--bg-soft); }
  .month-cell.other{ background:var(--bg); }
  .month-cell.other .day-num{ color:var(--text-dim); opacity:.55; }
  .day-num{ font-family:var(--font-display); font-size:17px; line-height:1; width:28px; height:26px; display:flex; align-items:center; margin-bottom:3px; }
  .month-cell.today .day-num{ color:var(--accent); }
  .month-cell.today .day-num::after{ content:""; display:block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-left:4px; }
  .ev-chip{ display:block; width:100%; text-align:left; border:none; border-radius:2px; padding:2px 6px; margin-bottom:2px; font-size:11.5px; line-height:1.35; color:#fffaf1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ev-chip.timed{ background:transparent !important; color:var(--text); padding-left:0; }
  .ev-chip.timed .ev-dot{ display:inline-block; width:3px; height:11px; margin-right:5px; vertical-align:-1px; }
  .ev-chip.timed .ev-time{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); margin-right:3px; }
  .ev-chip:hover{ filter:brightness(1.1); }
  .ev-chip.due{ background:transparent; color:var(--text); border:1px dashed var(--accent); padding:1px 5px; }
  .ev-chip.due .icon{ width:11px; height:11px; vertical-align:-1px; margin-right:3px; color:var(--accent); }
  .ev-chip.due.done{ color:var(--text-dim); text-decoration:line-through; border-color:var(--border); }
  .ev-chip.due.done .icon{ color:var(--text-dim); }
  .ev-chip.due:hover{ background:var(--bg-soft); filter:none; }
  .ev-chip.timed:hover{ background:var(--bg-soft) !important; filter:none; }
  .more-link{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); border:none; background:none; padding:0; }
  .more-link:hover{ color:var(--accent); }

  /* Schedule: week */
  .week-wrap{ background:var(--bg-elev); border:1px solid var(--border); border-top:1px solid var(--rule); }
  .week-head, .week-allday{ display:grid; grid-template-columns:52px repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--border); }
  .week-head div{ padding:8px 4px; text-align:center; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); border-left:1px solid var(--border); }
  .week-head div:first-child, .week-allday > div:first-child{ border-left:none; }
  .week-head .today{ color:var(--accent); }
  .week-allday > div{ border-left:1px solid var(--border); padding:3px; min-height:26px; }
  .week-allday .lbl{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); padding:6px 4px; }
  .week-body{ position:relative; display:grid; grid-template-columns:52px repeat(7,minmax(0,1fr)); height:600px; overflow-y:auto; }
  .week-hours div{ height:44px; font-family:var(--font-mono); font-size:10px; color:var(--text-dim); text-align:right; padding-right:6px; transform:translateY(-7px); }
  .week-col{ position:relative; border-left:1px solid var(--border); background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 43px, var(--border) 43px, var(--border) 44px); height:1056px; cursor:pointer; }
  .week-ev{ position:absolute; left:2px; right:2px; border-radius:2px; padding:3px 5px; font-size:11px; color:#fffaf1; overflow:hidden; border:none; text-align:left; line-height:1.3; font-family:var(--font-mono); }
  .week-ev b{ display:block; font-family:var(--font-body); font-weight:500; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Schedule: list — timetable rows */
  .agenda-day{ display:grid; grid-template-columns:76px minmax(0,1fr); gap:16px; border-top:1px solid var(--rule); padding:12px 0 6px; }
  .agenda-day:last-child{ border-bottom:1px solid var(--rule); }
  .agenda-date{ line-height:1.1; }
  .agenda-date .dnum{ display:block; font-family:var(--font-display); font-size:34px; font-weight:500; }
  .agenda-date .dlbl{ display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-top:2px; }
  .agenda-date.today .dnum, .agenda-date.today .dlbl{ color:var(--accent); }
  .agenda-item{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:8px 4px; background:none; border:none; border-bottom:1px dashed var(--border); }
  .agenda-item:last-child{ border-bottom:none; }
  .agenda-item:hover{ background:var(--bg-soft); }
  .agenda-bar{ width:3px; align-self:stretch; flex-shrink:0; }
  .agenda-time{ width:96px; flex-shrink:0; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); }
  .agenda-main{ flex:1; min-width:0; }
  .agenda-main b{ display:block; font-weight:500; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Tasks: board of tickets */
  .filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .kanban{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; align-items:start; }

/* =====================================================================
   Dates — all club times are Europe/Istanbul.
   Istanbul is UTC+3 all year (no daylight saving since 2016), so a fixed
   offset keeps the calendar maths simple and exact.
   Day keys are 'YYYY-MM-DD' strings in Istanbul time.
   ===================================================================== */
const IST_OFFSET_MS = 3 * 3600 * 1000;
const DAY_MS = 86400000;
const pad2 = n => String(n).padStart(2,'0');
function ymdKey(y, m0, d){
  const dt = new Date(Date.UTC(y, m0, d));
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==((m0%12)+12)%12 || dt.getUTCDate()!==d) return null;
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth()+1)}-${pad2(dt.getUTCDate())}`;
}
function keyParts(key){ const [y,m,d] = key.split('-').map(Number); return { y, m0:m-1, d }; }
function keyToUtcMs(key){ const p = keyParts(key); return Date.UTC(p.y, p.m0, p.d); }
function msToKey(ms){ const d = new Date(ms); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`; }
function addDays(key, n){ return msToKey(keyToUtcMs(key) + n*DAY_MS); }
function daysBetween(a, b){ return Math.round((keyToUtcMs(b) - keyToUtcMs(a)) / DAY_MS); }
function weekdayOf(key){ return (new Date(keyToUtcMs(key)).getUTCDay() + 6) % 7; } // Monday = 0
function daysInMonth(y, m0){ return new Date(Date.UTC(y, m0+1, 0)).getUTCDate(); }
function istParts(iso){
  const d = new Date(new Date(iso).getTime() + IST_OFFSET_MS);
  return { key: msToKey(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())), hh:d.getUTCHours(), mi:d.getUTCMinutes() };
}
function istKey(iso){ return istParts(iso).key; }
function istToIso(key, hh, mi){ return new Date(keyToUtcMs(key) + (hh*60+mi)*60000 - IST_OFFSET_MS).toISOString(); }
function todayKey(){ return istKey(new Date().toISOString()); }
function startOfWeek(key){ return addDays(key, -weekdayOf(key)); }
function monthKey(key, deltaMonths){ const p = keyParts(key); return ymdKey(p.y, p.m0 + deltaMonths, 1) || msToKey(Date.UTC(p.y, p.m0+deltaMonths, 1)); }
function fmtDay(key, opts){ return new Intl.DateTimeFormat(locale(), Object.assign({ timeZone:'UTC' }, opts)).format(new Date(keyToUtcMs(key))); }
function fmtTime(iso){ return new Intl.DateTimeFormat(locale(), { timeZone:'Europe/Istanbul', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(new Date(iso)); }
function fmtDateShort(key){ return fmtDay(key, { day:'numeric', month:'short' }); }
function fmtDateLong(key){ return fmtDay(key, { weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
function weekdayShort(i){ return fmtDay(addDays('2024-01-01', i), { weekday:'short' }); } // 2024-01-01 is a Monday
function weekdayLong(i){ return fmtDay(addDays('2024-01-01', i), { weekday:'long' }); }
function hhmm(iso){ const p = istParts(iso); return `${pad2(p.hh)}:${pad2(p.mi)}`; }

/* =====================================================================
   Recurrence
   rrule = { freq:'daily'|'weekly'|'monthly'|'yearly', interval, byweekday:[0..6],
             monthlyMode:'day'|'nth', nth:1..4|-1, end:{type:'never'|'until'|'count', date, count} }
   ===================================================================== */
function nthWeekdayKey(y, m0, wd, nth){
  const dim = daysInMonth(y, m0);
  if(nth === -1){
    const lastWd = weekdayOf(ymdKey(y, m0, dim));
    return ymdKey(y, m0, dim - ((lastWd - wd + 7) % 7));
  }
  const firstWd = weekdayOf(ymdKey(y, m0, 1));
  const day = 1 + ((wd - firstWd + 7) % 7) + (nth-1)*7;
  return day > dim ? null : ymdKey(y, m0, day);
}
// All occurrence day keys from startKey up to and including maxKey, honouring the end rule.
function ruleDates(startKey, r, maxKey){
  if(!r) return startKey <= maxKey ? [startKey] : [];
  const out = [];
  const interval = Math.max(1, parseInt(r.interval, 10) || 1);
  const end = r.end || { type:'never' };
  const limitKey = (end.type==='until' && end.date && end.date < maxKey) ? end.date : maxKey;
  const maxCount = end.type==='count' ? Math.max(1, parseInt(end.count, 10) || 1) : Infinity;
  let guard = 0;
  // returns false when generation must stop
  const emit = k => {
    if(k > limitKey || out.length >= maxCount) return false;
    if(k >= startKey) out.push(k);
    return out.length < maxCount;
  };
  const sp = keyParts(startKey);
  if(r.freq === 'daily'){
    for(let i=0; guard++ < 40000; i+=interval){ if(!emit(addDays(startKey, i))) break; }
  }else if(r.freq === 'weekly'){
    const days = (r.byweekday && r.byweekday.length ? [...r.byweekday] : [weekdayOf(startKey)]).map(Number).sort((a,b)=>a-b);
    const ws = startOfWeek(startKey);
    outer: for(let w=0; guard++ < 10000; w+=interval){
      for(const wd of days){
        const k = addDays(ws, w*7 + wd);
        if(k < startKey) continue;
        if(!emit(k)) break outer;
      }
    }
  }else if(r.freq === 'monthly'){
    const wd = weekdayOf(startKey);
    for(let i=0; guard++ < 5000; i+=interval){
      const first = msToKey(Date.UTC(sp.y, sp.m0 + i, 1));
      if(first > limitKey) break;
      const fp = keyParts(first);
      const k = r.monthlyMode==='nth' ? nthWeekdayKey(fp.y, fp.m0, wd, Number(r.nth)||1) : ymdKey(fp.y, fp.m0, sp.d);
      if(k === null) continue;
      if(!emit(k)) break;
    }
  }else if(r.freq === 'yearly'){
    for(let i=0; guard++ < 500; i+=interval){
      if(`${sp.y+i}-01-01` > limitKey) break;
      const k = ymdKey(sp.y + i, sp.m0, sp.d);
      if(k === null) continue;
      if(!emit(k)) break;
    }
  }else{
    emit(startKey);
  }
  return out;
}
// Occurrences of one event that overlap [rangeStartIso, rangeEndIso).
function expandEvent(ev, exceptions, rangeStartIso, rangeEndIso){
  const sp = istParts(ev.start_at);
  const dur = new Date(ev.end_at) - new Date(ev.start_at);
  const exMap = {};
  let maxKey = addDays(istKey(rangeEndIso), 1);
  for(const x of exceptions){ exMap[x.original_date] = x; if(x.original_date > maxKey) maxKey = x.original_date; }
  const minKey = addDays(istKey(rangeStartIso), -Math.ceil(dur / DAY_MS) - 1);
  const rs = new Date(rangeStartIso).getTime(), re = new Date(rangeEndIso).getTime();
  const out = [];
  for(const k of ruleDates(sp.key, ev.rrule, maxKey)){
    const x = exMap[k];
    if(k < minKey && !x) continue;
    if(x && x.cancelled) continue;
    const start = (x && x.start_at) || istToIso(k, sp.hh, sp.mi);
    const end = (x && x.end_at) || new Date(new Date(start).getTime() + dur).toISOString();
    const s = new Date(start).getTime(), e = new Date(end).getTime();
    if(s < re && (e > rs || (e === s && s >= rs))){
      out.push({
        key: ev.id + '|' + k, event: ev, originalDate: k, exception: x || null,
        title: x && x.title != null ? x.title : ev.title,
        description: x && x.description != null ? x.description : ev.description,
        location: x && x.location != null ? x.location : ev.location,
        start, end, allDay: ev.all_day, color: ev.color,
      });
    }
  }
  return out;
}
function nthLabel(n){ return t(n === -1 ? 'nthLast' : 'nth' + n); }
function ruleText(r, startKey){
  if(!r) return '';
  const n = Math.max(1, parseInt(r.interval,10)||1);
  let s;
  if(r.freq==='daily') s = n===1 ? t('ruleDaily') : t('ruleDailyN', {n});
  else if(r.freq==='weekly'){
    const days = (r.byweekday && r.byweekday.length ? r.byweekday : [weekdayOf(startKey)]).slice().sort().map(weekdayShort).join(', ');
    s = n===1 ? t('ruleWeekly', {days}) : t('ruleWeeklyN', {n, days});
  }else if(r.freq==='monthly'){
    if(r.monthlyMode==='nth'){
      const p = { n, nth: nthLabel(Number(r.nth)||1), wd: weekdayLong(weekdayOf(startKey)) };
      s = n===1 ? t('ruleMonthlyNth', p) : t('ruleMonthlyNthN', p);
    }else{
      const d = keyParts(startKey).d;
      s = n===1 ? t('ruleMonthlyDay', {d}) : t('ruleMonthlyDayN', {n, d});
    }
  }else if(r.freq==='yearly'){
    const date = fmtDay(startKey, { day:'numeric', month:'long' });
    s = n===1 ? t('ruleYearly', {date}) : t('ruleYearlyN', {n, date});
  }
  const e = r.end || {};
  if(e.type==='until' && e.date) s += t('ruleUntil', { date: fmtDay(e.date, { day:'numeric', month:'short', year:'numeric' }) });
  if(e.type==='count') s += t('ruleCount', { n: e.count });
  return s;
}

   Data layer — Supabase, or an in-memory fake for ?demo
   ===================================================================== */
function usernameToEmail(u){ return `${u.toLowerCase().replace(/[^a-z0-9_.-]/g,'')}@${EMAIL_DOMAIN}`; }

function makeSupabaseApi(){
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const check = ({ data, error }) => { if(error) throw error; return data; };
  const applyMatch = (q, match) => { for(const k in match) q = q.eq(k, match[k]); return q; };
  return {
    async signIn(username, password){ const { error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password }); if(error) throw error; },
    async signUp(username, password){
      const { data, error } = await sb.auth.signUp({ email: usernameToEmail(username), password, options:{ data:{ username } } });
      if(error) throw error;
      if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('User already registered');
      if(!data.session) await this.signIn(username, password);
    },
    async signOut(){ await sb.auth.signOut(); },
    async changePassword(username, current, next){
      const { error: e1 } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password: current });
      if(e1) throw new Error('WRONG_CURRENT');
      const { error: e2 } = await sb.auth.updateUser({ password: next });
      if(e2) throw e2;
      await sb.auth.signOut({ scope: 'others' });
    },
    async userId(){ const { data } = await sb.auth.getSession(); return data.session ? data.session.user.id : null; },
    async list(table, match){ return check(await applyMatch(sb.from(table).select('*'), match || {})); },
    async insert(table, row){ check(await sb.from(table).insert(row)); },
    async update(table, match, patch){
      const rows = check(await applyMatch(sb.from(table).update(patch), match).select());
      if(!rows || !rows.length) throw new Error('NO_PERMISSION');
    },
    async remove(table, match){
      const rows = check(await applyMatch(sb.from(table).delete(), match).select());
      if(!rows || !rows.length) throw new Error('NO_PERMISSION');
    },
    async upsert(table, row, onConflict){ check(await sb.from(table).upsert(row, { onConflict })); },
    async rpc(fn, params){ return check(await sb.rpc(fn, params)); },
    subscribe(onChange, onStatus){
      const ch = sb.channel('club-db')
        .on('postgres_changes', { event:'*', schema:'public' }, p => onChange(p.table))
        .subscribe(status => onStatus(status === 'SUBSCRIBED'));
      return () => sb.removeChannel(ch);
    },
  };
}

  const delay = () => new Promise(r => setTimeout(r, 60));
  return {

    },
    async update(table, match, patch){
      await delay();
      if(table === 'profiles' && 'role' in patch && (!isAdmin() || match.id === uid)) throw new Error('NO_PERMISSION');
      if(table === 'profiles' && 'position' in patch){
        if(!isAdmin() || (match.id === uid && me().role !== 'admin')) throw new Error('NO_PERMISSION');
        if(patch.position && db.profiles.some(p => p.position === patch.position && p.id !== match.id)) throw new Error('duplicate key value violates unique constraint "profiles_position_unique"');
        if(patch.position && patch.position.startsWith('head_')) patch = { ...patch, team: patch.position.slice(5) };
        if(patch.position === 'president' || patch.position === 'vice_president') patch = { ...patch, team: null };
      }else if(table === 'profiles' && 'team' in patch && !isAdmin()){
        const target = db.profiles.find(p => p.id === match.id), mine = headOf(me());
        const ok = mine && target && target.id !== uid && ((!target.team && patch.team === mine && target.role !== 'pending' && !target.position) || (target.team === mine && patch.team === null));
        if(!ok) throw new Error('NO_PERMISSION');
      }
      if(table === 'tasks' && 'team' in patch && patch.team && !isAdmin() && patch.team !== headOf(me())) throw new Error('NO_PERMISSION');
      let rows = db[table].filter(r => matches(r, match));
      if(table === 'notes') rows = rows.filter(n => canReadNote(n) && (n.author_id === uid || n.readers_can_edit));
      if(!rows.length) throw new Error('NO_PERMISSION');
      if(table === 'notes' && rows.some(n => n.author_id !== uid) && ('visibility' in patch || 'readers_can_edit' in patch)) throw new Error('NO_PERMISSION');
      rows.forEach(r => Object.assign(r, patch, table === 'notes' ? { updated_at: new Date().toISOString(), updated_by: uid } : {})); changed(table);
    },
    async remove(table, match){
      await delay();
      const before = db[table].length;
      db[table] = db[table].filter(r => !matches(r, match));
      if(db[table].length === before) throw new Error('NO_PERMISSION');
      if(table === 'events'){
        const ids = new Set(db.events.map(e => e.id));
        db.event_exceptions = db.event_exceptions.filter(x => ids.has(x.event_id));
        db.tasks.forEach(tk => { if(tk.event_id && !ids.has(tk.event_id)){ tk.event_id = null; tk.event_date = null; } });
        changed('event_exceptions'); changed('tasks');
      }
      if(table === 'tasks'){
        const ids = new Set(db.tasks.map(x => x.id));
        db.task_claims = db.task_claims.filter(c => ids.has(c.task_id));
        db.task_comments = db.task_comments.filter(c => ids.has(c.task_id));
        db.task_tags = db.task_tags.filter(c => ids.has(c.task_id)); changed('task_tags');
        changed('task_claims');
      }
      if(table === 'tags'){ const ids = new Set(db.tags.map(x => x.id)); db.task_tags = db.task_tags.filter(x => ids.has(x.tag_id)); changed('task_tags'); }
      if(table === 'notes'){ const ids = new Set(db.notes.map(x => x.id)); db.note_shares = db.note_shares.filter(x => ids.has(x.note_id)); db.note_hidden = db.note_hidden.filter(x => ids.has(x.note_id)); }
      if(table === 'profiles'){
        const u = Object.keys(users).find(n => users[n].id === match.id); if(u) delete users[u];
      }
      changed(table);
    },
    async upsert(table, row, onConflict){
      await delay();
      const cols = onConflict.split(',');
      const existing = db[table].find(r => cols.every(c => r[c] === row[c]));
      if(existing) Object.assign(existing, row); else db[table].push({ ...row });
      changed(table);
    },
    async rpc(fn, params){
      await delay();
      if(fn === 'request_password_reset'){
        const u = users[String(params.p_username).trim().toLowerCase()];
        if(!params.p_password || params.p_password.length < 6) throw new Error('Password must be 6 to 72 characters');
        const code = Math.random().toString(16).slice(2, 10).toUpperCase().padEnd(8, '0');
        if(!u) return code;
        resets = resets.filter(r => r.user_id !== u.id).concat({ user_id: u.id, pw: params.p_password, code, created_at: new Date().toISOString() });
        return code;
      }
      if(fn === 'list_password_resets'){
        if(!isAdmin()) throw new Error('NO_PERMISSION');
        return resets.map(r => { const p = db.profiles.find(x => x.id === r.user_id) || {}; return { user_id: r.user_id, username: p.username, display_name: p.display_name, created_at: r.created_at }; });
      }
      if(fn === 'resolve_password_reset'){
        if(!isAdmin()) throw new Error('NO_PERMISSION');
        const r = resets.find(x => x.user_id === params.p_user);
        if(!r) throw new Error('Request not found');
        if(params.p_approve && String(params.p_code || '').trim().toUpperCase() !== r.code) throw new Error('WRONG_CODE');
        resets = resets.filter(x => x !== r);
        if(params.p_approve){ const u = Object.values(users).find(x => x.id === r.user_id); if(u) u.password = r.pw; }
        return null;
      }
      if(fn !== 'create_next_task_copy') throw new Error('unknown function');
      const src = db.tasks.find(x => x.id === params.p_task_id);
      if(!src || !src.repeat) return null;
      const series = src.series_id || src.id;
      if(src.status !== 'done' || !params.p_due || params.p_due <= src.due_date) throw new Error('INVALID_NEXT_COPY');
      if(db.tasks.some(x => (x.series_id || x.id) === series && (x.due_date === params.p_due || x.occurrence === (src.occurrence || 1) + 1))) return null;
      const id = uuid();
      const maxPos = db.tasks.filter(x => x.status === 'todo').reduce((m, x) => Math.max(m, x.position), 0);
      db.tasks.push({ ...src, id, status:'todo', due_date: params.p_due, event_date: params.p_event_date, position: maxPos + 1, series_id: series, occurrence: (src.occurrence || 1) + 1, created_at: new Date().toISOString() });
      db.task_tags.filter(x => x.task_id === src.id).forEach(x => db.task_tags.push({ task_id:id, tag_id:x.tag_id }));
      db.task_claims.filter(x => x.task_id === src.id).slice(0, src.slots).forEach(x => db.task_claims.push({ task_id:id, user_id:x.user_id, claimed_at:new Date().toISOString() }));
      ['tasks','task_tags','task_claims'].forEach(changed);
      return id;
    },
    subscribe(onChange, onStatus){ listener = onChange; onStatus(true); return () => { listener = () => {}; }; },
  };
}

function isAdminProfile(p){ return !!p && (p.role === 'admin' || (p.role !== 'pending' && (p.position === 'president' || p.position === 'vice_president'))); }
function isAdmin(){ return isAdminProfile(state.me); }
const TEAMS = ['finance','events','media'];
const TEAM_HEAD = { finance:'head_finance', events:'head_events', media:'head_media' };
const POSITIONS = ['president','vice_president','head_finance','head_events','head_media'];
function headOf(p){ p = p || state.me; return p && p.role !== 'pending' && p.position && p.position.startsWith('head_') ? p.position.slice(5) : null; }
function userInTeam(p, team){ return !!p && p.role !== 'pending' && (p.team === team || p.position === TEAM_HEAD[team]); }

function positionLabel(pos){ return pos ? t({ president:'posPresident', vice_president:'posVP', head_finance:'posHeadFinance', head_events:'posHeadEvents', head_media:'posHeadMedia' }[pos]) : ''; }
function holderOf(pos){ return state.profiles.find(p => p.position === pos) || null; }
function profileTitle(p){ return p.position ? positionLabel(p.position) : p.team ? t('teamOf', { team: teamName(p.team) }) : t(p.role === 'admin' && isAdmin() ? 'roleAdmin' : p.role === 'pending' ? 'rolePending' : 'roleMember'); }
function assignableTeams(){ return isAdmin() ? TEAMS : (headOf() ? [headOf()] : []); }
function canEditEvent(ev){ return isAdmin() || ev.created_by === state.uid; }
function canEditTask(tk){ return isAdmin() || tk.created_by === state.uid || (!!tk.team && tk.team === headOf()); }
function claimsOf(taskId){ return state.task_claims.filter(c => c.task_id === taskId).sort((a,b)=> String(a.claimed_at).localeCompare(String(b.claimed_at))); }
function hasClaimed(taskId){ return state.task_claims.some(c => c.task_id === taskId && c.user_id === state.uid); }
function canMoveTask(tk){ return canEditTask(tk) || hasClaimed(tk.id); }
function exceptionsOf(eventId){ return state.event_exceptions.filter(x => x.event_id === eventId); }
function occurrencesBetween(startIso, endIso){
  const out = [];
  for(const ev of state.events) out.push(...expandEvent(ev, exceptionsOf(ev.id), startIso, endIso));
  return out.sort((a,b) => (b.allDay - a.allDay) || a.start.localeCompare(b.start));
}

function askCode(text){
  return new Promise(resolve => {
    let answered = false;
    const el = openModal(`<p style="margin:0 0 10px">${esc(text)}</p>
      <div class="field"><label>${t('resetCode')}</label><input type="text" id="reset-code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12"></div>
      <div class="modal-actions"><button class="btn" data-r="0">${t('cancel')}</button><button class="btn btn-primary" data-r="1">${t('approve')}</button></div>`,
      { onClose: () => { if(!answered) resolve(null); } });
    const inp = el.querySelector('#reset-code-input');
    setTimeout(() => inp.focus(), 0);
    const finish = ok => { answered = true; resolve(ok ? inp.value.trim().toUpperCase() || null : null); closeModal(el); };
    el.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => finish(b.dataset.r === '1')));
    inp.addEventListener('keydown', ev => { if(ev.key === 'Enter') finish(true); });
  });
}
async function resolveReset(userId, approve){
  const r = state.resets.find(x => x.user_id === userId);

  if(approve){
    code = await askCode(t('confirmResetApprove', { name: r ? r.username : '' }));
    if(!code) return;
  }
  try{ await api.rpc('resolve_password_reset', { p_user: userId, p_approve: approve, p_code: code }); toast(t(approve ? 'resetApproved' : 'resetRejected')); }
  catch(e){ if(/WRONG_CODE/.test(e.message || '')) toast(t('wrongCode')); else showError(e); }

}

    catch(e){ msg('#pf-name-msg', errMessage(e), true); }
  });
  el.querySelector('#pf-pass-btn').addEventListener('click', async () => {
    const cur = el.querySelector('#pf-cur').value, nw = el.querySelector('#pf-new').value, nw2 = el.querySelector('#pf-new2').value;

    if(nw === cur){ msg('#pf-pass-msg', t('errSamePass'), true); return; }
    const btn = el.querySelector('#pf-pass-btn'); btn.disabled = true;
    try{
      await api.changePassword(me.username, cur, nw);

async function route(){

async function loadAll(){

    tables.forEach((tb, i) => { state[tb] = results[i]; });

/* Live updates: refetch the changed table (debounced), then re-render. */
const pendingTables = new Set();
let refetchTimer = null;
function startLive(){
  if(unsubscribe) return;
  unsubscribe = api.subscribe(table => {
    pendingTables.add(table);
    clearTimeout(refetchTimer);
    refetchTimer = setTimeout(flushRefetch, 150);
  }, ok => { $('offline-badge').hidden = ok; });
}
function stopLive(){ if(unsubscribe){ unsubscribe(); unsubscribe = null; } }
async function flushRefetch(){
  const tables = [...pendingTables]; pendingTables.clear();
  if(!state.uid) return;
  // pending users only watch their own profile
  if(!state.me || state.me.role === 'pending'){
    if(tables.includes('profiles')) await route();
    return;
  }
  try{
    for(const tb of tables){
      if(tb === 'task_comments'){ if(state.openTaskId) await loadComments(state.openTaskId); continue; }
      if(!(tb in state)) continue;
      if(NOTE_TABLES.includes(tb) && !state.notesLoaded) continue;
      state[tb] = await api.list(tb);
    }
  }catch(e){ showError(e); return; }
  if(tables.includes('profiles')){
    const me = state.profiles.find(p => p.id === state.uid);
    if(!me || me.role === 'pending'){ stopLive(); await route(); return; }
    const scopeChanged = state.me && (state.me.team !== me.team || state.me.position !== me.position || state.me.role !== me.role);
    state.me = me;
    if(scopeChanged){ for(const tb of ['tasks','task_claims','task_tags']) state[tb] = await api.list(tb); }
  }
  renderAll();
}
async function reload(...tables){
  try{ for(const tb of tables) state[tb] = await api.list(tb); }catch(e){ showError(e); }
  renderAll();
}

const modalStack = [];
function openModal(html, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="modal-overlay"></div><div class="modal-box ${opts.wide?'wide':''}">${html}</div>`;
  wrap.querySelector('.modal-overlay').addEventListener('click', () => closeModal(wrap));
  $('modal-root').appendChild(wrap);
  modalStack.push({ el: wrap, onClose: opts.onClose });
  const first = wrap.querySelector('[autofocus]'); if(first) setTimeout(() => first.focus(), 0);
  return wrap;
}
function closeModal(el){
  const i = el ? modalStack.findIndex(m => m.el === el) : modalStack.length - 1;
  if(i < 0) return;
  const [m] = modalStack.splice(i, 1);
  m.el.remove();
  if(m.onClose) m.onClose();
}
function closeAllModals(){ while(modalStack.length) closeModal(); }
function modalHeader(title){ return `<div class="modal-title"><span>${title}</span><button class="modal-close" data-action="close-modal" aria-label="${t('close')}">${icon('x')}</button></div>`; }
function confirmDialog(text, okLabel){
  return new Promise(resolve => {
    let answered = false;
    const el = openModal(`<p style="margin:0 0 6px">${esc(text)}</p><div class="modal-actions"><button class="btn" data-r="0">${t('cancel')}</button><button class="btn btn-primary" data-r="1">${esc(okLabel || t('delete'))}</button></div>`,
      { onClose: () => { if(!answered) resolve(false); } });
    el.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { answered = true; resolve(b.dataset.r === '1'); closeModal(el); }));
  });
}
function askScope(title, allowThis){
  return new Promise(resolve => {
    let answered = false;
    const opts = [allowThis ? 'this' : null, 'following', 'all'].filter(Boolean);
    const labels = { this:'scopeThis', following:'scopeFollowing', all:'scopeAll' };
    const el = openModal(modalHeader(esc(title)) + opts.map(o => `<button class="scope-btn" data-scope="${o}">${t(labels[o])}</button>`).join('') +
      `<div class="modal-actions"><button class="btn" data-scope="">${t('cancel')}</button></div>`, { onClose: () => { if(!answered) resolve(null); } });
    el.querySelectorAll('[data-scope]').forEach(b => b.addEventListener('click', () => { answered = true; resolve(b.dataset.scope || null); closeModal(el); }));
  });
}

/* ---------- Search everything (Ctrl K) ---------- */
// Next occurrence of an event within a year, or its most recent one.
function eventOccFor(ev){
  const now = new Date().toISOString(), today = todayKey();
  const next = expandEvent(ev, exceptionsOf(ev.id), istToIso(today, 0, 0), istToIso(addDays(today, 400), 0, 0)).find(o => o.end > now);
  if(next) return { occ: next, upcoming: true };
  const past = expandEvent(ev, exceptionsOf(ev.id), ev.start_at, istToIso(addDays(today, 1), 0, 0));
  return past.length ? { occ: past[past.length - 1], upcoming: false } : null;
}
function hl(text, q){
  const raw = String(text || ''), n = norm(raw), i = q ? n.indexOf(q) : -1;
  if(i < 0 || n.length !== raw.length) return esc(raw);
  return esc(raw.slice(0, i)) + '<mark>' + esc(raw.slice(i, i + q.length)) + '</mark>' + esc(raw.slice(i + q.length));
}
function searchResults(qRaw){
  const q = norm(qRaw.trim());
  if(q.length < 2) return null;
  const has = (...parts) => norm(parts.filter(Boolean).join(' ')).includes(q);
  const groups = [];
  const tasks = state.tasks.filter(tk => has(tk.title, tk.description, tagsOf(tk.id).map(x => x.name).join(' ')))
    .sort((a,b) => (a.status === 'done') - (b.status === 'done') || (a.due_date || '9999').localeCompare(b.due_date || '9999')).slice(0, 8);
  if(tasks.length) groups.push(['srTasks', tasks.map(tk => ({ kind:'task', id:tk.id, icon:'tasks', title:tk.title,
    sub: [t(statusKey(tk.status)), tk.due_date ? fmtDateShort(tk.due_date) : '', tk.team ? teamName(tk.team) : '', tagsOf(tk.id).map(x => x.name).join(', ')].filter(Boolean).join(' · ') }))]);
  const evs = [];
  for(const ev of state.events){
    const titles = [ev.title, ...exceptionsOf(ev.id).map(x => x.title)];
    if(!has(titles.join(' '), ev.location, ev.description)) continue;
    const r = eventOccFor(ev);
    if(r) evs.push({ kind:'event', id:r.occ.key, icon:ev.rrule ? 'repeat' : 'calendar', title:r.occ.title,
      sub: [t(r.upcoming ? 'nextOn' : 'lastOn', { date: fmtDateShort(istKey(r.occ.start)) + (r.occ.allDay ? '' : ' ' + hhmm(r.occ.start)) }), r.occ.location].filter(Boolean).join(' · '),
      sort: (r.upcoming ? '0' : '1') + (r.upcoming ? r.occ.start : String(9e15 - Date.parse(r.occ.start))) });
  }
  evs.sort((a,b) => a.sort.localeCompare(b.sort));
  if(evs.length) groups.push(['srEvents', evs.slice(0, 6)]);
  if(state.notesLoaded){
    const hidden = hiddenNoteIds();
    const notes = state.notes.filter(n => has(n.title, n.body)).sort((a,b) => hidden.has(a.id) - hidden.has(b.id) || String(b.updated_at).localeCompare(String(a.updated_at))).slice(0, 6);
    if(notes.length) groups.push(['srNotes', notes.map(n => ({ kind:'note', id:n.id, icon:n.visibility === 'private' ? 'lock' : n.visibility === 'members' ? 'globe' : 'users', title:noteTitle(n),
      sub: profileName(n.author_id) + ' · ' + fmtDateShort(istKey(n.updated_at)) }))]);
  }
  const people = state.profiles.filter(pr => pr.role !== 'pending' && has(pr.display_name, pr.username, profileTitle(pr))).slice(0, 6);
  if(people.length) groups.push(['srPeople', people.map(pr => ({ kind:'person', id:pr.id, icon:'user', title:pr.display_name || pr.username, sub:'@' + pr.username + ' · ' + profileTitle(pr) }))]);
  return { q, groups };
}
function openSearch(){
  if(!state.me || $('app').hidden) return;
  if(document.querySelector('.modal [data-search]')) return;
  document.body.classList.remove('nav-open');
  if(!state.notesLoaded && !state.notesLoading) loadNotes().then(() => { const i = document.querySelector('#search-input'); if(i) i.dispatchEvent(new Event('input')); });
  const el = openModal(`<div data-search class="search-box">${icon('search')}<input type="search" id="search-input" placeholder="${esc(t('searchPh'))}" autocomplete="off" spellcheck="false" autofocus><button class="modal-close" data-action="close-modal" aria-label="${t('close')}">${icon('x')}</button></div>
    <div class="sr-results" id="search-results"><div class="sr-hint">${t('searchHint')}</div></div>`, { wide: true });
  const inp = el.querySelector('#search-input'), box = el.querySelector('#search-results');
  let items = [], sel = 0;
  const paint = () => box.querySelectorAll('.sr-item').forEach((b, i) => b.classList.toggle('sel', i === sel));
  inp.addEventListener('input', () => {
    const r = searchResults(inp.value);
    items = []; sel = 0;
    if(!r){ box.innerHTML = `<div class="sr-hint">${t('searchHint')}</div>`; return; }
    if(!r.groups.length){ box.innerHTML = `<div class="sr-hint">${t('searchNone')}</div>`; return; }
    box.innerHTML = r.groups.map(([label, list]) => `<div class="sr-group">${t(label)}</div>` + list.map(it => {
      items.push(it);
      return `<button class="sr-item" data-sr="${items.length - 1}">${icon(it.icon)}<span class="sr-main"><b>${hl(it.title, r.q)}</b><span>${esc(it.sub)}</span></span></button>`;
    }).join('')).join('');
    paint();
  });
  inp.addEventListener('keydown', ev => {
    if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      if(!items.length) return;
      ev.preventDefault(); sel = (sel + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; paint();
      const b = box.querySelector('.sr-item.sel'); if(b) b.scrollIntoView({ block:'nearest' });
    }else if(ev.key === 'Enter' && items[sel]){ ev.preventDefault(); openResult(items[sel]); }
  });
  box.addEventListener('click', ev => { const b = ev.target.closest('[data-sr]'); if(b) openResult(items[+b.dataset.sr]); });
  function openResult(it){
    closeModal(el);
    if(it.kind === 'task') openTaskDetail(it.id);
    else if(it.kind === 'event') openEventDetail(it.id);
    else if(it.kind === 'note'){ state.openNoteId = it.id; state.noteEdit = null; setView('notes'); }
    else if(it.kind === 'person') setView(isAdmin() ? 'members' : 'teams');
  }
}

/* ---------- Add an event to your own calendar ---------- */
function calStamp(iso){ return iso.replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function calDates(o){
  return o.allDay ? [istKey(o.start).replace(/-/g, ''), istKey(o.end).replace(/-/g, ''), true]
                  : [calStamp(o.start), calStamp(o.end), false];
}
function googleCalUrl(o){
  const [a, b] = calDates(o);
  const q = new URLSearchParams({ action:'TEMPLATE', text:o.title, dates:`${a}/${b}`, details:o.description || '', location:o.location || '' });
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
function icsEscape(v){ return String(v || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function downloadIcs(o){
  const [a, b, allDay] = calDates(o);
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//OzuTo//Club App//EN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${o.key.replace('|', '-')}@ozuto`, `DTSTAMP:${calStamp(new Date().toISOString())}`,
    allDay ? `DTSTART;VALUE=DATE:${a}` : `DTSTART:${a}`, allDay ? `DTEND;VALUE=DATE:${b}` : `DTEND:${b}`,
    `SUMMARY:${icsEscape(o.title)}`];
  if(o.location) lines.push(`LOCATION:${icsEscape(o.location)}`);
  if(o.description) lines.push(`DESCRIPTION:${icsEscape(o.description)}`);
  lines.push('END:VEVENT', 'END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n') + '\r\n'], { type:'text/calendar;charset=utf-8' });
  const a2 = document.createElement('a');
  a2.href = URL.createObjectURL(blob);
  a2.download = (o.title.replace(/[^\p{L}\p{N} _-]/gu, '').trim() || 'event') + '.ics';
  document.body.appendChild(a2); a2.click(); a2.remove();
  setTimeout(() => URL.revokeObjectURL(a2.href), 1000);
}

function dayRangeIso(key){ return [istToIso(key,0,0), istToIso(addDays(key,1),0,0)]; }
function occOnDay(occs, key){
  const [ds, de] = dayRangeIso(key);

}
function evChip(o){

function renderMonth(){
  const first = monthKey(state.calCursor, 0);
  const gridStart = startOfWeek(first);
  const gridEnd = addDays(gridStart, 42);
  const occs = occurrencesBetween(istToIso(gridStart,0,0), istToIso(gridEnd,0,0));
  const curMonth = keyParts(first).m0, today = todayKey();
  let html = '<div class="month-grid">';
  for(let i=0;i<7;i++) html += `<div class="month-head">${esc(weekdayShort(i))}</div>`;
  for(let i=0;i<42;i++){
    const k = addDays(gridStart, i);
    const list = [...occOnDay(occs, k).map(evChip), ...tasksDueOn(k).map(dueChip)];
    const shown = list.slice(0, 3);
    html += `<div class="month-cell ${keyParts(k).m0!==curMonth?'other':''} ${k===today?'today':''}" data-action="day-click" data-day="${k}">

function renderWeek(){
  const ws = startOfWeek(state.calCursor), today = todayKey();
  const occs = occurrencesBetween(istToIso(ws,0,0), istToIso(addDays(ws,7),0,0));
  let head = '<div class="week-head"><div></div>', allday = `<div class="week-allday"><div class="lbl">${t('allDay')}</div>`, cols = '';
  for(let i=0;i<7;i++){
    const k = addDays(ws, i);
    head += `<div class="${k===today?'today':''}">${esc(fmtDay(k,{weekday:'short'}))} ${keyParts(k).d}</div>`;
    const dayOccs = occOnDay(occs, k);
    allday += `<div>${dayOccs.filter(o => o.allDay).map(evChip).join('')}${tasksDueOn(k).map(dueChip).join('')}</div>`;
    const timed = dayOccs.filter(o => !o.allDay);
    // simple side-by-side layout for overlapping events
    const lanes = [];
    const placed = timed.map(o => {
      const [ds] = dayRangeIso(k);
      const s = Math.max(0, (new Date(o.start) - new Date(ds)) / 60000);
      const e = Math.min(1440, Math.max(s + 20, (new Date(o.end) - new Date(ds)) / 60000));
      let lane = lanes.findIndex(end => end <= s); if(lane < 0){ lane = lanes.length; lanes.push(e); } else lanes[lane] = e;
      return { o, s, e, lane };
    });
    const n = Math.max(1, lanes.length);
    cols += `<div class="week-col" data-action="week-slot" data-day="${k}">${placed.map(({o,s,e,lane}) =>
      `<button class="week-ev" style="top:${s/60*44}px;height:${(e-s)/60*44-2}px;left:calc(${lane/n*100}% + 2px);width:calc(${100/n}% - 4px);background:${colorOf(o.color)}" data-action="open-occ" data-occ="${esc(o.key)}"><b>${esc(o.title)}</b>${hhmm(o.start)}–${hhmm(o.end)}</button>`).join('')}</div>`;
  }

  for(let h=0; h<24; h++) hours += `<div>${h ? pad2(h)+':00' : ''}</div>`;

}
function renderAgenda(){
  const start = state.calCursor, end = addDays(start, 60), today = todayKey();
  const occs = occurrencesBetween(istToIso(start,0,0), istToIso(end,0,0));
  if(!occs.length && !state.tasks.some(tk => tk.due_date && tk.due_date >= start && tk.due_date < end)) return `<div class="card empty-state">${t('noEvents')}</div>`;
  let html = '';
  for(let k = start; k < end; k = addDays(k,1)){

    html += `<div class="agenda-day"><div class="agenda-date ${k===today?'today':''}"><span class="dnum">${keyParts(k).d}</span><span class="dlbl">${esc(fmtDay(k,{weekday:'short'}))} · ${esc(fmtDay(k,{month:'short'}))}</span></div><div>` +

// Shows/hides the repeat fields; returns a refresh function to call when the start date changes.
function wireRepeat(el, p, r, getStartKey){
  const q = sel => el.querySelector(sel);
  const mmode = r && r.freq==='monthly' ? (r.monthlyMode==='nth' ? (Number(r.nth)===-1 ? 'last' : 'nth') : 'day') : 'day';
  function refresh(){
    const f = q(`#${p}-freq`).value, sk = getStartKey();
    el.querySelectorAll(`.${p}-rep-only`).forEach(x => x.hidden = f==='none');
    el.querySelectorAll(`.${p}-rep-weekly`).forEach(x => x.hidden = f!=='weekly');
    el.querySelectorAll(`.${p}-rep-monthly`).forEach(x => x.hidden = f!=='monthly');
    q(`#${p}-unit`).textContent = t({daily:'uDays',weekly:'uWeeks',monthly:'uMonths',yearly:'uYears'}[f] || 'uDays');
    const et = q(`#${p}-endtype`).value;
    q(`#${p}-until`).hidden = et !== 'until'; q(`#${p}-count-wrap`).hidden = et !== 'count';
    // monthly options depend on the start date
    const pp = keyParts(sk), wd = weekdayOf(sk), nth = Math.ceil(pp.d/7), isLast = pp.d + 7 > daysInMonth(pp.y, pp.m0);
    const cur = (el.querySelector(`input[name=${p}-mm]:checked`) || {}).value || mmode;
    const opts = [['day', t('monthlyDay',{d:pp.d})]];
    if(nth <= 4) opts.push(['nth', t('monthlyNth',{nth:nthLabel(nth), wd:weekdayLong(wd)})]);
    if(isLast) opts.push(['last', t('monthlyNth',{nth:nthLabel(-1), wd:weekdayLong(wd)})]);
    const sel = opts.some(o => o[0]===cur) ? cur : 'day';
    q(`#${p}-mmode-wrap`).innerHTML = opts.map(([v,l]) => `<label class="check" style="display:flex;margin-bottom:4px"><input type="radio" name="${p}-mm" value="${v}" ${v===sel?'checked':''}> ${esc(l)}</label>`).join('');
  }
  [`#${p}-freq`, `#${p}-endtype`].forEach(s => q(s).addEventListener('change', refresh));
  refresh();
  return refresh;
}
function readRepeat(el, p, startKey){
  const q = sel => el.querySelector(sel);
  const f = q(`#${p}-freq`).value;
  if(f === 'none') return { rrule: null };
  const rrule = { freq: f, interval: Math.min(99, Math.max(1, parseInt(q(`#${p}-interval`).value,10) || 1)) };
  if(f === 'weekly'){
    rrule.byweekday = [...el.querySelectorAll(`input[name=${p}-wd]:checked`)].map(x => Number(x.value));
    if(!rrule.byweekday.length) return { error: t('errWeekdays') };
  }
  if(f === 'monthly'){
    const mm = (el.querySelector(`input[name=${p}-mm]:checked`) || {}).value || 'day';
    rrule.monthlyMode = mm === 'day' ? 'day' : 'nth';
    if(mm === 'nth') rrule.nth = Math.ceil(keyParts(startKey).d / 7);
    if(mm === 'last') rrule.nth = -1;
  }
  const et = q(`#${p}-endtype`).value;
  if(et === 'until'){
    const d = q(`#${p}-until`).value;
    if(!d || d < startKey) return { error: t('errUntil') };
    rrule.end = { type:'until', date:d };
  }else if(et === 'count'){
    rrule.end = { type:'count', count: Math.min(999, Math.max(1, parseInt(q(`#${p}-count`).value,10) || 1)) };
  }else rrule.end = { type:'never' };
  return { rrule };
}

function closeModalsOfKind(kind){ modalStack.filter(m => m.el.dataset.kind === kind).forEach(m => closeModal(m.el)); }
function readEventForm(el){
  const q = sel => el.querySelector(sel);
  const title = q('#ef-title').value.trim();
  if(!title) return { error: t('errTitle') };
  const allDay = q('#ef-allday').checked;
  const sk = q('#ef-sdate').value, ek = q('#ef-edate').value || sk;
  if(!sk) return { error: t('errEndBeforeStart') };
  let start, end;
  if(allDay){
    start = istToIso(sk, 0, 0); end = istToIso(addDays(ek, 1), 0, 0);
  }else{
    const [sh, sm] = (q('#ef-stime').value || '00:00').split(':').map(Number);
    const [eh, em] = (q('#ef-etime').value || '00:00').split(':').map(Number);
    start = istToIso(sk, sh, sm); end = istToIso(ek, eh, em);
  }
  if(new Date(end) <= new Date(start)) return { error: t('errEndBeforeStart') };
  const rep = readRepeat(el, 'ef', sk);
  if(rep.error) return { error: rep.error };
  const rrule = rep.rrule;
  return {
    title, allDay, start, end, rrule,
    location: q('#ef-loc').value.trim() || null,
    description: q('#ef-desc').value.trim() || null,
    color: (el.querySelector('input[name=ef-color]:checked') || {}).value || 'violet',
  };
}
function eventRow(v){
  return { title:v.title, description:v.description, location:v.location, color:v.color, all_day:v.allDay, start_at:v.start, end_at:v.end, rrule:v.rrule };
}
async function createEvent(v, taskOpts){
  const evId = uuid();
  await api.insert('events', { id: evId, ...eventRow(v), created_by: state.uid });
  if(taskOpts){
    // meeting task: chosen people are claimed; a repeating event's task follows the event dates
    const sk = istKey(v.start);
    const first = v.rrule ? (ruleDates(sk, v.rrule, addDays(sk, 400))[0] || sk) : sk;
    const taskId = uuid();
    await api.insert('tasks', { id: taskId, title: v.title, description: v.description, due_date: first, priority: taskOpts.priority,
      status: 'todo', slots: Math.max(1, taskOpts.people.length), event_id: evId, event_date: v.rrule ? first : null,
      position: nextPosition('todo'), created_by: state.uid,
      repeat: v.rrule ? { followEvent: true } : null, series_id: v.rrule ? taskId : null, occurrence: 1 });
    for(const id of taskOpts.people) await api.insert('task_claims', { task_id: taskId, user_id: id });
    await reload('events', 'tasks', 'task_claims');
    return;
  }
  await reload('events');
}
const sameRule = (a, b) => JSON.stringify(a || null) === JSON.stringify(b || null);

async function saveEventEdit(occ, v){
  const ev = occ.event;
  if(!ev.rrule){
    await api.update('events', { id: ev.id }, eventRow(v));
    await reload('events');
    return;
  }
  const ruleChanged = !sameRule(ev.rrule, v.rrule);
  const scope = await askScope(t('scopeEditTitle'), !ruleChanged && v.allDay === !!ev.all_day);
  if(!scope) return false;
  const D = occ.originalDate, seriesStart = istKey(ev.start_at);
  if(scope === 'this'){
    const defStart = istToIso(D, istParts(ev.start_at).hh, istParts(ev.start_at).mi);
    const defEnd = new Date(new Date(defStart).getTime() + (new Date(ev.end_at) - new Date(ev.start_at))).toISOString();
    const prev = occ.exception || {};
    await api.upsert('event_exceptions', {
      id: prev.id || uuid(), event_id: ev.id, original_date: D, cancelled: false,
      title: v.title !== ev.title ? v.title : null,
      description: (v.description || null) !== (ev.description || null) ? v.description : null,
      location: (v.location || null) !== (ev.location || null) ? v.location : null,
      start_at: v.start !== defStart ? v.start : null,
      end_at: v.end !== defEnd ? v.end : null,
    }, 'event_id,original_date');
    if(v.color !== ev.color) await api.update('events', { id: ev.id }, { color: v.color });
    await reload('event_exceptions', 'events');
    return;
  }
  if(scope === 'all' || D === seriesStart){
    // shift the series start by the same number of days the occurrence moved
    const shift = daysBetween(D, istKey(v.start));
    const newStartKey = addDays(seriesStart, shift);
    const sp = istParts(v.start);
    const newStart = v.allDay ? istToIso(newStartKey, 0, 0) : istToIso(newStartKey, sp.hh, sp.mi);
    const newEnd = new Date(new Date(newStart).getTime() + (new Date(v.end) - new Date(v.start))).toISOString();
    await api.update('events', { id: ev.id }, { ...eventRow(v), start_at: newStart, end_at: newEnd });
    if(ruleChanged || newStart !== ev.start_at){
      await dropOrphanExceptions(ev.id, newStartKey, v.rrule, () => true);
    }
    await reload('events', 'event_exceptions');
    return;
  }
  // this and following: end the old series the day before, start a new one here
  const used = ruleDates(seriesStart, ev.rrule, addDays(D, -1)).length;
  const newRule = v.rrule ? JSON.parse(JSON.stringify(v.rrule)) : null;
  if(newRule && newRule.end && newRule.end.type === 'count' && ev.rrule.end && ev.rrule.end.type === 'count' && newRule.end.count === ev.rrule.end.count){
    newRule.end.count = Math.max(1, newRule.end.count - used);
  }
  const newId = uuid();
  await api.insert('events', { id: newId, ...eventRow({ ...v, rrule: newRule }), created_by: ev.created_by || state.uid });
  await api.update('events', { id: ev.id }, { rrule: { ...ev.rrule, end: { type:'until', date: addDays(D, -1) } } });
  const newDates = new Set(ruleDates(istKey(v.start), newRule, maxExceptionKey(ev.id)));
  for(const x of exceptionsOf(ev.id).filter(x => x.original_date >= D)){
    if(newDates.has(x.original_date)) await api.update('event_exceptions', { id: x.id }, { event_id: newId });
    else await api.remove('event_exceptions', { id: x.id });
  }
  // keep tasks pointing at occurrences that moved to the new series
  for(const tk of state.tasks.filter(tk => tk.event_id === ev.id && tk.event_date && tk.event_date >= D && canEditTask(tk))){
    await api.update('tasks', { id: tk.id }, { event_id: newId });
  }
  await reload('events', 'event_exceptions', 'tasks');
}
function maxExceptionKey(eventId){
  return exceptionsOf(eventId).reduce((m, x) => x.original_date > m ? x.original_date : m, todayKey());
}
// Delete exceptions whose date is no longer an occurrence of the (new) rule.
async function dropOrphanExceptions(eventId, startKey, rrule, filter){
  const dates = new Set(ruleDates(startKey, rrule, maxExceptionKey(eventId)));
  for(const x of exceptionsOf(eventId).filter(filter)){
    if(!dates.has(x.original_date)) await api.remove('event_exceptions', { id: x.id });
  }
}
async function deleteOccurrence(occKey){
  const o = findOcc(occKey); if(!o) return;
  const ev = o.event;
  try{
    if(!ev.rrule){
      if(!await confirmDialog(t('confirmDeleteEvent'))) return;
      await api.remove('events', { id: ev.id });
    }else{
      const scope = await askScope(t('scopeDeleteTitle'), true);
      if(!scope) return;
      const D = o.originalDate, seriesStart = istKey(ev.start_at);
      if(scope === 'this'){
        await api.upsert('event_exceptions', { id: (o.exception && o.exception.id) || uuid(), event_id: ev.id, original_date: D, cancelled: true,
          title:null, description:null, location:null, start_at:null, end_at:null }, 'event_id,original_date');
      }else if(scope === 'all' || D === seriesStart){
        await api.remove('events', { id: ev.id });
      }else{
        await api.update('events', { id: ev.id }, { rrule: { ...ev.rrule, end: { type:'until', date: addDays(D, -1) } } });
        for(const x of exceptionsOf(ev.id).filter(x => x.original_date >= D)) await api.remove('event_exceptions', { id: x.id });
      }
    }
    closeModalsOfKind('event');
    toast(t('deleted'));
    await reload('events', 'event_exceptions', 'tasks');
  }catch(e){ showError(e); }
}

function taskEventLabel(tk){
  if(!tk.event_id) return '';

function tagsOf(taskId){
  const ids = new Set(state.task_tags.filter(x => x.task_id === taskId).map(x => x.tag_id));

function filteredTasks(){
  const f = state.taskFilter, q = norm(f.q.trim());
  return state.tasks.filter(tk => {
    if(f.mine && !hasClaimed(tk.id) && tk.created_by !== state.uid) return false;
    if(f.open && claimsOf(tk.id).length >= tk.slots) return false;
    if(f.priority && tk.priority !== f.priority) return false;
    if(f.event && tk.event_id !== f.event) return false;
    if(f.tag && !state.task_tags.some(x => x.task_id === tk.id && x.tag_id === f.tag)) return false;
    if(f.team && (f.team === 'club' ? !!tk.team : tk.team !== f.team)) return false;

}

async function moveTask(taskId, status, position){
  const tk = state.tasks.find(x => x.id === taskId);
  if(!tk) return;
  const pos = position != null ? position : nextPosition(status);
  const prev = { status: tk.status, position: tk.position };
  Object.assign(tk, { status, position: pos }); renderAll(); // optimistic
  try{ await api.update('tasks', { id: taskId }, { status, position: pos }); }
  catch(e){ Object.assign(tk, prev); renderAll(); showError(e); return; }
  if(status === 'done' && prev.status !== 'done' && tk.repeat) await createNextCopy(tk);
}
// Next due date (and event date) for a repeating task, or null when the rule has ended.
function nextTaskDates(tk){
  if(!tk || !tk.repeat || !tk.due_date) return null;
  if(tk.repeat.followEvent){
    const ev = state.events.find(e => e.id === tk.event_id);
    if(!ev) return null;
    const after = tk.event_date || tk.due_date;
    const occs = expandEvent(ev, exceptionsOf(ev.id), istToIso(after, 0, 0), istToIso(addDays(after, 800), 0, 0));
    const o = occs.find(x => x.originalDate > after);
    return o ? { due: istKey(o.start), eventDate: o.originalDate } : null;
  }
  const r = tk.repeat, end = r.end || {};
  if(end.type === 'count' && (tk.occurrence || 1) >= end.count) return null;
  const open = { ...r, end: end.type === 'until' ? end : { type:'never' } };
  const next = ruleDates(tk.due_date, open, addDays(tk.due_date, 800)).find(d => d > tk.due_date);
  return next ? { due: next, eventDate: tk.event_date || null } : null;
}
async function createNextCopy(tk){
  const n = nextTaskDates(tk);
  if(!n) return;
  try{
    const id = await api.rpc('create_next_task_copy', { p_task_id: tk.id, p_due: n.due, p_event_date: n.eventDate });
    if(id) toast(t('nextCopy', { date: fmtDateShort(n.due) }));
  }catch(e){ showError(e); }
  await reload('tasks', 'task_claims', 'task_tags');
}
function openMoveMenu(taskId){
  const tk = state.tasks.find(x => x.id === taskId);
  if(!tk || !canMoveTask(tk)) return;
  const el = openModal(modalHeader(t('moveTo')) + `<div class="menu-list">${STATUSES.map(s => `<button data-s="${s}" class="${tk.status===s?'current':''}">${t(statusKey(s))}</button>`).join('')}</div>`);

}

/* ---------- Drag and drop (desktop) ---------- */
let dragId = null;
document.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.task-card');
  if(!card) return;
  dragId = card.dataset.task; card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  document.querySelectorAll('.drop-line').forEach(x => x.remove());
});
function dropIndex(col, y){
  const cards = [...col.querySelectorAll('.task-card:not(.dragging)')];
  const i = cards.findIndex(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height/2; });
  return { cards, i: i < 0 ? cards.length : i };
}
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.kanban-col');
  if(!col || !dragId) return;
  e.preventDefault();
  document.querySelectorAll('.drop-target').forEach(x => x !== col && x.classList.remove('drop-target'));
  col.classList.add('drop-target');
  document.querySelectorAll('.drop-line').forEach(x => x.remove());
  const { cards, i } = dropIndex(col, e.clientY);
  const line = document.createElement('div'); line.className = 'drop-line';
  if(cards[i]) col.insertBefore(line, cards[i]); else col.appendChild(line);
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.kanban-col');
  if(!col || !dragId) return;
  e.preventDefault();
  const { cards, i } = dropIndex(col, e.clientY);
  const posOf = c => (state.tasks.find(x => x.id === c.dataset.task) || {}).position || 0;
  const before = cards[i-1], after = cards[i];
  const pos = before && after ? (posOf(before) + posOf(after)) / 2 : before ? posOf(before) + 1 : after ? posOf(after) - 1 : 1;
  const id = dragId;
  dragId = null;
  moveTask(id, col.dataset.status, pos);
});

/* ---------- Long-press (touch) ---------- */
let pressTimer = null, pressFired = false;
document.addEventListener('touchstart', e => {
  const card = e.target.closest && e.target.closest('.task-card');
  if(!card) return;
  pressFired = false;
  pressTimer = setTimeout(() => { pressFired = true; openMoveMenu(card.dataset.task); }, 550);
}, { passive:true });
['touchend','touchmove','touchcancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(pressTimer), { passive:true }));

    ${canDeleteNote(n) ? `<div class="modal-actions"><button class="btn btn-danger" data-action="note-delete" data-id="${n.id}">${t('delete')}</button></div>` : ''}`;
}
function renderNoteSettings(n){

    <div class="field"><span class="field-label">${t('visibility')}</span>

// Escape first, then apply a few line-based marks. No HTML from the note ever reaches the page.
function noteInline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderNoteBody(body, canEdit){
  let html = '', inList = false;
  body.split('\n').forEach((ln, i) => {
    const chk = ln.match(/^\s*\[( |x|X)\]\s?(.*)$/);
    const bullet = !chk && ln.match(/^\s*[-*]\s+(.*)$/);
    if(bullet){ if(!inList){ html += '<ul>'; inList = true; } html += `<li>${noteInline(bullet[1])}</li>`; return; }
    if(inList){ html += '</ul>'; inList = false; }
    let m;
    if(chk) html += `<label class="note-check"><input type="checkbox" data-action="note-check" data-line="${i}" ${chk[1] !== ' ' ? 'checked' : ''} ${canEdit ? '' : 'disabled'}><span>${noteInline(chk[2])}</span></label>`;
    else if((m = ln.match(/^##\s+(.*)$/))) html += `<h3>${noteInline(m[1])}</h3>`;
    else if((m = ln.match(/^#\s+(.*)$/))) html += `<h2>${noteInline(m[1])}</h2>`;
    else if(!ln.trim()) html += '<div class="note-gap"></div>';
    else html += `<p>${noteInline(ln)}</p>`;
  });
  if(inList) html += '</ul>';
  return html;
}
function noteDirty(){
  const ed = state.noteEdit; if(!ed || !$('ne-body')) return false;
  const n = state.notes.find(x => x.id === ed.id);
  return !n || $('ne-title').value !== n.title || $('ne-body').value !== n.body;
}
async function leaveNoteEditor(){
  if(noteDirty() && !await confirmDialog(t('discardChanges'), t('discard'))) return false;
  state.noteEdit = null;
  return true;
}
function startNoteEdit(n){ state.noteEdit = { id: n.id, title: n.title, body: n.body, base: n.updated_at }; renderNotes(true); const b = $('ne-body'); if(b) b.focus(); }
function updateConflictBanner(){
  const box = $('ne-conflict');
  if(!box || !state.noteEdit) return;
  const n = state.notes.find(x => x.id === state.noteEdit.id);
  const changed = !n || n.updated_at !== state.noteEdit.base;
  box.innerHTML = changed ? `<div class="conflict">${esc(t('noteConflict', { name: n ? profileName(n.updated_by) : '—' }))} <button class="btn btn-sm" data-action="note-reload">${t('reload')}</button></div>` : '';
}
async function saveNote(){
  const ed = state.noteEdit;
  if(!ed || !$('ne-body')) return;
  ed.title = $('ne-title').value; ed.body = $('ne-body').value;
  try{
    // only saves if nobody changed the note since it was opened
    await api.update('notes', { id: ed.id, updated_at: ed.base }, { title: ed.title, body: ed.body });
    state.noteEdit = null; toast(t('saved'));
    await reloadNotes();
  }catch(e){
    if(/NO_PERMISSION/.test(String(e && e.message))){
      for(const tb of NOTE_TABLES) state[tb] = await api.list(tb);
      const n = state.notes.find(x => x.id === ed.id);
      if(n && n.updated_at !== ed.base){ renderNotes(); return; }
    }
    showError(e);
  }
}
async function toggleNoteCheck(line){
  const n = state.notes.find(x => x.id === state.openNoteId);
  if(!n || !canEditNote(n)) return;
  const lines = n.body.split('\n');
  lines[line] = lines[line].replace(/\[( |x|X)\]/, m => m === '[ ]' ? '[x]' : '[ ]');
  try{ await api.update('notes', { id: n.id, updated_at: n.updated_at }, { body: lines.join('\n') }); }catch(e){ showError(e); }
  await reloadNotes();
}
async function updateNoteSettings(patch){
  try{ await api.update('notes', { id: state.openNoteId }, patch); }catch(e){ showError(e); }
  await reloadNotes();
}

/* =====================================================================
